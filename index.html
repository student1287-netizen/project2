<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Методы измерения физических величин</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

.top-bar {
    background: #3B4B75;
    color: rgb(255, 255, 255);
    padding: 10px;
    text-align: right;}

.container {
    display: flex;
    height: calc(100vh - 50px);}

.left {
    width: 33.33%;
    background: #092551;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    border-right: 2px solid #444;
    overflow-y: auto;
}

.category {
    margin-bottom: 15px;
}

.category-title {
    font-weight: bold;
    cursor: pointer;
}

.category-title:hover {
    text-decoration: underline;
}

.subpage {
    margin-left: 15px;
    cursor: pointer;
    margin-top: 5px;
}

.subpage:hover {
    text-decoration: underline;
}

.delete-btn {
    display: none;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
    margin-left: 5px;
}

.add-btn {
    display: none;
    margin-top: 10px;
    background: #444;
    color: white;
    border: none;
    padding: 5px;
    cursor: pointer;
}

.right {
    width: 66.66%;
    padding: 20px;
    overflow-y: auto;
}

.telegram-btn {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #0088cc;
    color: white;
    padding: 12px 18px;
    text-decoration: none;
    border-radius: 6px;
}

.editable[contenteditable="true"] {
    border: 1px dashed red;
    padding: 3px;
}
</style>
</head>

<body>

<div class="top-bar">
    <button onclick="toggleEditMode()">Режим администратора</button>
    <button id="addPhotoBtn" onclick="addPhoto()" style="display:none;">
        Добавить фото
    </button>
</div>

<div class="container">

    <div class="left" id="menu">

        <button class="add-btn" id="addCategoryBtn" onclick="addCategory()">+ Добавить категорию</button>

    </div>

    <div class="right" id="content">
        <div id="home" class="page editable">
            <h2>Главная страница</h2>
            <p>Тут будет описание</p>
        </div>
    </div>

</div>

<a class="telegram-btn" href="https://t.me/predloshka_dlia_saita_bot" target="_blank">
    предложка
</a>
<script>
let editMode = false;
const password = "1234";
let idCounter = 0;
let currentPageId = "home";

function toggleEditMode() {
    if (!editMode) {
        let input = prompt("Введите пароль");
        if (input === password) {
            editMode = true;
            document.querySelectorAll(".editable").forEach(el => el.contentEditable = "true");
            document.querySelectorAll(".delete-btn").forEach(btn => btn.style.display = "inline");
            document.querySelectorAll(".add-btn").forEach(btn => btn.style.display = "block");
            document.getElementById("addPhotoBtn").style.display = "inline-block";
        } else {
            alert("Неверный пароль");
        }
    } else {
        editMode = false;
            document.querySelectorAll(".editable").forEach(el => el.contentEditable = "false");
            document.querySelectorAll(".delete-btn").forEach(btn => btn.style.display = "none");
            document.querySelectorAll(".add-btn").forEach(btn => btn.style.display = "none");
            document.getElementById("addPhotoBtn").style.display = "none";
    }
}

function showPage(id) {
    currentPageId = id;
    document.querySelectorAll(".page").forEach(p => p.style.display = "none");
    document.getElementById(id).style.display = "block";
}

function addCategory() {
    let title = prompt("Название категории");
    if (!title) return;

    idCounter++;
    let catId = "cat" + idCounter;

    let category = document.createElement("div");
    category.className = "category";
    category.setAttribute("data-id", catId);

    let titleSpan = document.createElement("span");
    titleSpan.textContent = title;
    titleSpan.className = "category-title editable";
    titleSpan.contentEditable = editMode;
    titleSpan.onclick = function() { showPage(catId); };
    let delBtn = document.createElement("button");
    delBtn.textContent = "X";
    delBtn.className = "delete-btn";
    delBtn.onclick = function() {
        document.getElementById(catId).remove();
        category.remove();
    };

    let addSubBtn = document.createElement("button");
    addSubBtn.textContent = "+ Подстраница";
    addSubBtn.className = "add-btn";
    addSubBtn.onclick = function() {
        addSubPage(category, catId);
    };

    category.appendChild(titleSpan);
    category.appendChild(delBtn);
    category.appendChild(addSubBtn);

    document.getElementById("menu").appendChild(category);

    let page = document.createElement("div");
    page.id = catId;
    page.className = "page editable";
    page.style.display = "none";
    page.innerHTML = "<h2>" + title + "</h2><p>Описание категории...</p>";
    document.getElementById("content").appendChild(page);

    showPage(catId);
}

function addSubPage(categoryElement, parentId) {
    let title = prompt("Название подстраницы:");
    if (!title) return;

    idCounter++;
    let pageId = "page" + idCounter;

    let sub = document.createElement("div");
    sub.className = "subpage editable";
    sub.textContent = title;
    sub.contentEditable = editMode;
    sub.onclick = function() { showPage(pageId); };

    let delBtn = document.createElement("button");
    delBtn.textContent = "X";
    delBtn.className = "delete-btn";
    delBtn.onclick = function() {
        document.getElementById(pageId).remove();
        sub.remove();
    };

    sub.appendChild(delBtn);
    categoryElement.appendChild(sub);

    let page = document.createElement("div");
    page.id = pageId;
    page.className = "page editable";
    page.style.display = "none";
    page.innerHTML = "<h2>" + title + "</h2><p>Текст подстраницы...</p>";
    document.getElementById("content").appendChild(page);

    showPage(pageId);
}


function addPhoto() {
    if (!editMode) return;

    let input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";

    input.onchange = function(event) {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            let imgContainer = document.createElement("div");

            let img = document.createElement("img");
            img.src = e.target.result;
            img.style.maxWidth = "100%";
            img.style.marginTop = "10px";

            let delBtn = document.createElement("button");
            delBtn.textContent = "Удалить фото";
            delBtn.className = "delete-btn";
            delBtn.style.display = "inline";
            delBtn.onclick = function() {
                imgContainer.remove();
            };

            imgContainer.appendChild(img);
            imgContainer.appendChild(delBtn);

            document.getElementById(currentPageId).appendChild(imgContainer);
        };

        reader.readAsDataURL(file);
    };

    input.click();
}
</script>

</body>
</html>
